<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Elearning Mobile</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="caption">05c — Đặt mật khẩu mới</div>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="battery"></div>
    </div>
  </div>
  <div class="screen">
    <div class="page">
      <a class="back" href="05b-verify-code.html">← Quay lại</a>
      <h1 class="headline">Đặt mật khẩu mới</h1>
      <p class="sub">Mật khẩu mới phải khác với mật khẩu cũ.</p>

      <div class="field">
        <label>Mật khẩu mới</label>
        <input class="line-input focused" type="password" value="Hung2026" readonly />
        <div class="strength">
          <div class="bar on"></div><div class="bar on"></div><div class="bar on"></div><div class="bar"></div>
        </div>
        <div class="hint">Tối thiểu 8 ký tự, có chữ hoa và số.</div>
      </div>

      <div class="field">
        <label>Xác nhận mật khẩu mới</label>
        <input class="line-input" type="password" placeholder="Nhập lại mật khẩu mới" />
      </div>

      <a class="btn" href="02-sign-in.html">Đặt lại mật khẩu</a>

      <div class="spacer"></div>
    </div>
  </div>
</div>
</body>
</html>
