<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />

<title>Sign In — lỗi — Elearning Mobile</title>
<link rel="stylesheet" href="style.css" />

<body>
<div class="caption">03 — Đăng nhập (lỗi)</div>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="battery"></div>
    </div>
  </div>
  <div class="screen">
    <div class="page">
      <h1 class="headline">Học tiếp nào</h1>
      <p class="sub">Đăng nhập để tiếp tục lộ trình học của bạn.</p>

      <div class="field">
        <label>Email</label>
        <input class="line-input" value="nguyenxuan.hung@rights-s.jp" readonly />
      </div>

      <div class="field">
        <label>Mật khẩu</label>
        <input class="line-input state-error" type="password" value="sai roi" readonly />
        <div class="field-foot between">
          <span class="toggle-link">Hiện</span>
          <a class="mini-link" href="05-forgot-password.html">Quên mật khẩu?</a>
        </div>
      </div>

      <a class="btn" href="02-sign-in.html">Đăng nhập</a>

      <div class="spacer"></div>
      <div class="foot-text">Chưa có tài khoản? <a class="mini-link" href="04-sign-up.html">Đăng ký</a></div>
    </div>
    <div class="toast">Email hoặc mật khẩu chưa đúng. Thử lại nhé.</div>
  </div>
</div>
