<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Elearning Mobile</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="caption">04 — Đăng ký</div>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="battery"></div>
    </div>
  </div>
  <div class="screen">
    <div class="page">
      <a class="back" href="02-sign-in.html">← Quay lại</a>
      <h1 class="headline">Bắt đầu hành trình học</h1>
      <p class="sub">Tạo tài khoản để lưu tiến độ và chứng chỉ của bạn.</p>

      <div class="field">
        <label>Email</label>
        <input class="line-input" placeholder="ban@email.com" />
      </div>

      <div class="field">
        <label>Mật khẩu</label>
        <input class="line-input focused" type="password" value="Hung2026" readonly />
        <div class="strength">
          <div class="bar on"></div><div class="bar on"></div><div class="bar on"></div><div class="bar"></div>
        </div>
        <div class="hint">Tối thiểu 8 ký tự, có chữ hoa và số.</div>
      </div>

      <div class="field">
        <label>Xác nhận mật khẩu</label>
        <input class="line-input" type="password" placeholder="Nhập lại mật khẩu" />
      </div>

      <div class="check-row">
        <div class="check-box checked"></div>
        <span>Tôi đồng ý với <span class="mini-link">Điều khoản sử dụng</span>.</span>
      </div>

      <a class="btn" href="06-success.html">Tạo tài khoản</a>

      <div class="spacer"></div>
      <div class="foot-text">Đã có tài khoản? <a class="mini-link" href="02-sign-in.html">Đăng nhập</a></div>
    </div>
  </div>
</div>
</body>
</html>
